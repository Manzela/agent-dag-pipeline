[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-dag-pipeline"
dynamic = ["version"]
description = "A production-grade 7-node autonomous agent DAG with fail-closed safety, O-R-A-V semantic evaluation, and a self-improving RL data flywheel."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Daniel Manzela"},
]
keywords = [
    "agent", "dag", "pipeline", "evaluation", "llm",
    "reinforcement-learning", "model-organisms", "fail-closed",
    "google-adk", "vertex-ai", "gcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
openai = ["openai>=1.20"]
google = ["google-genai>=1.0"]
observability = [
    "langfuse>=2.40,<3",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
training = [
    "torch>=2.2",
    "transformers>=4.38",
    "peft>=0.9",
    "trl>=0.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
]
adk = [
    "google-adk>=1.0,<2",
    "google-genai>=1.0",
]
gcp = [
    "google-cloud-aiplatform>=1.50",
    "google-cloud-firestore>=2.16",
    "google-cloud-secret-manager>=2.18",
]
armor = [
    "google-cloud-modelarmor>=0.1",
]

[project.scripts]
agent-dag = "agent_dag.__main__:main"

[project.urls]
Homepage = "https://github.com/Manzela/agent-dag-pipeline"
Documentation = "https://github.com/Manzela/agent-dag-pipeline/blob/main/docs/architecture.md"
Observatory = "https://manzela.github.io/pipeline-observatory/"
Issues = "https://github.com/Manzela/agent-dag-pipeline/issues"

[tool.hatch.version]
path = "agent_dag/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["agent_dag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "COM", "C4", "PT", "RET", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401", "S101", "COM812"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
